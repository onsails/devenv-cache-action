name: devenv cache
description: >-
  Cache devenv's Nix evaluation state (~/.cache/nix plus a validated SQLite snapshot of the
  nix-eval-cache.db) so ephemeral CI runners skip full re-evaluation. Restore at job start,
  save as the final successful step.
author: onsails
branding:
  icon: zap
  color: purple

inputs:
  mode:
    description: >-
      `restore` or `save`. Anything else is a hard error. Use `restore` at the top of the job
      and `save` as the final step (gated on `if: success()`).
    required: true
  working-directory:
    description: Directory containing devenv.nix / .devenv/.
    required: false
    default: .
  hash-files:
    description: >-
      Newline-separated files whose contents key the cache. Missing files are skipped; at
      least one must exist or the action fails.
    required: false
    default: |
      devenv.nix
      devenv.yaml
      devenv.lock
  key-prefix:
    description: First segment of the cache key.
    required: false
    default: devenv-eval
  key-suffix:
    description: >-
      Optional final key segment. Set to the GitHub run id to rotate the entry every run when a
      previously saved cache may be incomplete.
    required: false
    default: ''
  devenv-version:
    description: Override the detected devenv version used in the cache key.
    required: false
    default: ''
  cache-nix:
    description: Include ~/.cache/nix in the cache entry.
    required: false
    default: 'true'
  cache-eval:
    description: Include the validated eval-DB snapshot in the cache entry.
    required: false
    default: 'true'
  sqlite3-path:
    description: >-
      Executable used for the snapshot and integrity validation. Must resolve on PATH outside
      devenv shell. Absence is a hard error.
    required: false
    default: sqlite3

outputs:
  cache-hit:
    description: "'true' when the primary key matched exactly."
    value: ${{ steps.cache-restore.outputs.cache-hit }}
  primary-key:
    description: The computed primary cache key.
    value: ${{ steps.key.outputs.primary }}
  devenv-version:
    description: The devenv version used in the key.
    value: ${{ steps.key.outputs.devenv-version }}
  eval-cache-restored:
    description: "'true' when a validated eval-DB snapshot was installed."
    value: ${{ steps.restore-eval.outputs.eval-cache-restored }}
  eval-db-path:
    description: Path to the installed live eval DB, when restored.
    value: ${{ steps.restore-eval.outputs.eval-db-path }}

runs:
  using: composite
  steps:
    # --- shared key computation (both modes) ---
    - id: key
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HASH_FILES: ${{ inputs.hash-files }}
        DEVENV_VERSION_INPUT: ${{ inputs.devenv-version }}
        KEY_PREFIX: ${{ inputs.key-prefix }}
        KEY_SUFFIX: ${{ inputs.key-suffix }}
        CACHE_EVAL: ${{ inputs.cache-eval }}
      run: $GITHUB_ACTION_PATH/compute-key.sh

    # --- resolve sqlite3: prefer PATH, fall back to nix run, else fail ---
    - id: sqlite3
      shell: bash
      env:
        SQLITE3_INPUT: ${{ inputs.sqlite3-path }}
        CACHE_EVAL: ${{ inputs.cache-eval }}
      run: |
        set -euo pipefail
        resolved=""
        # 1. Direct path or command -v
        if [ -n "${SQLITE3_INPUT}" ] && [ -x "${SQLITE3_INPUT}" ]; then
          resolved="${SQLITE3_INPUT}"
        else
          resolved="$(command -v "${SQLITE3_INPUT}" 2>/dev/null || true)"
          if [ -n "$resolved" ] && [ ! -x "$resolved" ]; then resolved=""; fi
        fi
        # 2. Fall back to nix run wrapper (works on any runner with nix installed)
        if [ "${CACHE_EVAL}" = "true" ] && [ -z "$resolved" ]; then
          if command -v nix >/dev/null 2>&1; then
            wrapper="$RUNNER_TEMP/devenv-cache-sqlite3-wrapper.sh"
            mkdir -p "$RUNNER_TEMP"
            printf '#!/usr/bin/env bash\nexec nix run nixpkgs#sqlite-interactive -- "$@"\n' > "$wrapper"
            chmod +x "$wrapper"
            # Verify it actually works
            if "$wrapper" --version >/dev/null 2>&1; then
              resolved="$wrapper"
              echo "devenv-cache-action: sqlite3 not on PATH; using nix run nixpkgs#sqlite-interactive" >&2
            else
              echo "devenv-cache-action: nix found but 'nix run nixpkgs#sqlite-interactive' failed" >&2
            fi
          fi
        fi
        # 3. Hard fail only if both failed
        if [ "${CACHE_EVAL}" = "true" ] && [ -z "$resolved" ]; then
          echo "devenv-cache-action: sqlite3 not found on PATH and nix run fallback failed. Install sqlite3 or set sqlite3-path." >&2
          exit 1
        fi
        printf 'resolved=%s\n' "${resolved:-}" >> "$GITHUB_OUTPUT"

    # --- mode: restore ---
    - id: cache-restore
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.key.outputs.paths }}
        key: ${{ steps.key.outputs.primary }}
        restore-keys: ${{ steps.key.outputs.restore }}

    - id: restore-eval
      if: ${{ inputs.mode == 'restore' && steps.cache-restore.outputs.cache-hit == 'true' && inputs.cache-eval == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STAGING_DIR: ${{ steps.key.outputs.staging-dir }}
        MANIFEST: ${{ steps.key.outputs.manifest }}
        LIVE_DB: ${{ steps.key.outputs.live-db }}
        SQLITE3_PATH: ${{ steps.sqlite3.outputs.resolved }}
        EXPECTED_KEY: ${{ steps.key.outputs.primary }}
        DEVENV_VERSION: ${{ steps.key.outputs.devenv-version }}
        CACHE_EVAL: ${{ inputs.cache-eval }}
        GITHUB_ACTION_PATH: ${{ env.GITHUB_ACTION_PATH }}
      run: $GITHUB_ACTION_PATH/restore-eval-cache.sh

    # --- mode: save ---
    - id: snapshot-eval
      if: ${{ inputs.mode == 'save' && inputs.cache-eval == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STAGING_DIR: ${{ steps.key.outputs.staging-dir }}
        LIVE_DB: ${{ steps.key.outputs.live-db }}
        MANIFEST: ${{ steps.key.outputs.manifest }}
        SQLITE3_PATH: ${{ steps.sqlite3.outputs.resolved }}
        EXPECTED_KEY: ${{ steps.key.outputs.primary }}
        DEVENV_VERSION: ${{ steps.key.outputs.devenv-version }}
        CACHE_EVAL: ${{ inputs.cache-eval }}
        GITHUB_ACTION_PATH: ${{ env.GITHUB_ACTION_PATH }}
      run: $GITHUB_ACTION_PATH/snapshot-eval-cache.sh

    - id: cache-save
      if: ${{ inputs.mode == 'save' }}
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.key.outputs.paths }}
        key: ${{ steps.key.outputs.primary }}
