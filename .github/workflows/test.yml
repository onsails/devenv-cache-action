name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast structural gate: action.yml must pin post-snapshot/ to a SHA whose tree matches
  # HEAD. A stale pin ships the old finalizer to consumers while every job below still
  # exercises the new code, so this failure is invisible to the functional tests.
  post-snapshot-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: ./tests/check-post-snapshot-pin.sh

  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      # sqlite3 is preinstalled on the ubuntu runner image. Assert it instead of running
      # apt-get: an `apt-get update` against a stalled Azure mirror hangs the job until the
      # 6-hour timeout, and it only reinstalls a package that is already there.
      - run: sqlite3 --version

      # One call: restores at main (miss expected on seed), registers a success-gated
      # post-snapshot finalizer that runs before the cache post-save.
      - name: devenv eval cache (miss expected, post-snapshot registers here)
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          devenv-version: test-version
          key-suffix: ${{ github.run_id }}
          cache-nix-eval: true

      - name: Assert miss on first run
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] || { echo "expected cache miss on seed run (exact key)"; exit 1; }
          echo '${{ steps.cache.outputs.primary-key }}' | grep -Eq '^devenv-eval-Linux-x86_64-layoutv3-nix0-eval1-nixeval1-devenvtest-version-[0-9a-f]{64}(-[0-9]+)?$' \
            || { echo "primary-key shape wrong: ${{ steps.cache.outputs.primary-key }}"; exit 1; }

      # Ensure the following assertion attributes the Nix fingerprint DB to the real devenv
      # evaluation, not to setup work performed earlier in this job.
      - name: Clear pre-evaluation Nix fingerprint DBs
        shell: bash
        run: rm -rf "$HOME/.cache/nix/eval-cache-v6"

      # Seed the eval DB with a real evaluation. This runs AFTER the action main but BEFORE
      # the post-snapshot finalizer callback, which snapshots this DB at job completion.
      - run: nix run nixpkgs#devenv -- shell -- true
        working-directory: tests/fixture

      - name: Assert real evaluation created healthy DBs, then add deterministic fixture
        shell: bash
        working-directory: tests/fixture
        run: |
          [ -f .devenv/nix-eval-cache.db ] || { echo "no .devenv/nix-eval-cache.db after devenv shell"; exit 1; }
          sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok

          # This must be a genuine Nix fingerprint database from the real devenv command above.
          # Check it before creating self-test.sqlite, which only makes bounded-cache validation
          # deterministic if Nix changes its fingerprint-cache population behavior.
          genuine_nix_db="$(find "$HOME/.cache/nix/eval-cache-v6" -maxdepth 1 -type f -name '*.sqlite' ! -name self-test.sqlite -print -quit 2>/dev/null || true)"
          [ -n "$genuine_nix_db" ] || { echo "real devenv shell did not create a Nix fingerprint DB"; exit 1; }
          sqlite3 "$genuine_nix_db" 'PRAGMA quick_check;' | grep -qx ok

          mkdir -p "$HOME/.cache/nix/eval-cache-v6"
          sqlite3 "$HOME/.cache/nix/eval-cache-v6/self-test.sqlite" 'CREATE TABLE IF NOT EXISTS Attributes(parent INTEGER, name TEXT, type INTEGER, value TEXT, context TEXT); INSERT INTO Attributes(value) VALUES ("seed");'
          sqlite3 "$HOME/.cache/nix/eval-cache-v6/self-test.sqlite" 'PRAGMA quick_check;' | grep -qx ok

  # warm-1 exercises the archive produced after the seed finalizer. On a fresh runner, the
  # devenv eval DB may be rejected when its generated store references are unavailable; that
  # fail-closed result is expected, while the exact archive hit and Nix eval restore remain required.
  warm-1:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      # sqlite3 is preinstalled on the ubuntu runner image. Assert it instead of running
      # apt-get: an `apt-get update` against a stalled Azure mirror hangs the job until the
      # 6-hour timeout, and it only reinstalls a package that is already there.
      - run: sqlite3 --version

      - name: Restore warm cache (exact hit expected)
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          devenv-version: test-version
          key-suffix: ${{ github.run_id }}
          cache-nix-eval: true

      - name: Assert exact hit and Nix eval restore
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] || { echo "expected exact cache hit on warm-1"; exit 1; }
          [ "${{ steps.cache.outputs.nix-eval-cache-restored }}" = "true" ] || { echo "expected nix-eval-cache-restored=true"; exit 1; }
          test "${{ steps.cache.outputs.nix-eval-files-restored }}" -ge 1 || { echo "expected at least one restored Nix eval-cache DB"; exit 1; }

      - name: Assert conditional devenv and installed Nix DB integrity
        shell: bash
        working-directory: tests/fixture
        run: |
          if [ "${{ steps.cache.outputs.eval-cache-restored }}" = "true" ]; then
            [ -f .devenv/nix-eval-cache.db ] || { echo "eval-cache-restored=true but devenv eval DB was not installed"; exit 1; }
            sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok
          elif [ "${{ steps.cache.outputs.eval-cache-restored }}" = "false" ]; then
            [ ! -e .devenv/nix-eval-cache.db ] || { echo "devenv eval DB was installed despite eval-cache-restored=false"; exit 1; }
          else
            echo "unexpected eval-cache-restored value: ${{ steps.cache.outputs.eval-cache-restored }}"
            exit 1
          fi
          self_test="$HOME/.cache/nix/eval-cache-v6/self-test.sqlite"
          [ -f "$self_test" ] || { echo "seeded self-test.sqlite was not restored"; exit 1; }
          sqlite3 "$self_test" 'PRAGMA quick_check;' | grep -qx ok
          [ "$(sqlite3 "$self_test" 'SELECT value FROM Attributes WHERE value = "seed";')" = seed ] \
            || { echo "restored self-test.sqlite does not contain the seeded row"; exit 1; }

      - name: Time real devenv shell after warm restore
        shell: bash
        working-directory: tests/fixture
        run: |
          start=$SECONDS
          nix run nixpkgs#devenv -- shell -- true
          echo "devenv-shell-seconds=$((SECONDS - start))"

  # A second sequential warm restore exercises the same immutable archive after warm-1 completes.
  warm-2:
    needs: warm-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      # sqlite3 is preinstalled on the ubuntu runner image. Assert it instead of running
      # apt-get: an `apt-get update` against a stalled Azure mirror hangs the job until the
      # 6-hour timeout, and it only reinstalls a package that is already there.
      - run: sqlite3 --version

      - name: Restore warm cache (exact hit expected)
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          devenv-version: test-version
          key-suffix: ${{ github.run_id }}
          cache-nix-eval: true

      - name: Assert exact hit and Nix eval restore
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] || { echo "expected exact cache hit on warm-2"; exit 1; }
          [ "${{ steps.cache.outputs.nix-eval-cache-restored }}" = "true" ] || { echo "expected nix-eval-cache-restored=true"; exit 1; }
          test "${{ steps.cache.outputs.nix-eval-files-restored }}" -ge 1 || { echo "expected at least one restored Nix eval-cache DB"; exit 1; }

      - name: Assert conditional devenv and installed Nix DB integrity
        shell: bash
        working-directory: tests/fixture
        run: |
          if [ "${{ steps.cache.outputs.eval-cache-restored }}" = "true" ]; then
            [ -f .devenv/nix-eval-cache.db ] || { echo "eval-cache-restored=true but devenv eval DB was not installed"; exit 1; }
            sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok
          elif [ "${{ steps.cache.outputs.eval-cache-restored }}" = "false" ]; then
            [ ! -e .devenv/nix-eval-cache.db ] || { echo "devenv eval DB was installed despite eval-cache-restored=false"; exit 1; }
          else
            echo "unexpected eval-cache-restored value: ${{ steps.cache.outputs.eval-cache-restored }}"
            exit 1
          fi
          self_test="$HOME/.cache/nix/eval-cache-v6/self-test.sqlite"
          [ -f "$self_test" ] || { echo "seeded self-test.sqlite was not restored"; exit 1; }
          sqlite3 "$self_test" 'PRAGMA quick_check;' | grep -qx ok
          [ "$(sqlite3 "$self_test" 'SELECT value FROM Attributes WHERE value = "seed";')" = seed ] \
            || { echo "restored self-test.sqlite does not contain the seeded row"; exit 1; }

      - name: Time real devenv shell after warm restore
        shell: bash
        working-directory: tests/fixture
        run: |
          start=$SECONDS
          nix run nixpkgs#devenv -- shell -- true
          echo "devenv-shell-seconds=$((SECONDS - start))"


  # Timing control: snapshot-only restoration. This chain intentionally excludes the bounded
  # Nix fingerprint cache while otherwise running the same real devenv command as its peer.
  compare-snapshot-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      # sqlite3 is preinstalled on the ubuntu runner image. Assert it instead of running
      # apt-get: an `apt-get update` against a stalled Azure mirror hangs the job until the
      # 6-hour timeout, and it only reinstalls a package that is already there.
      - run: sqlite3 --version
      - name: Initialize snapshot-only comparison cache
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          key-prefix: comparison-snapshot
          key-suffix: ${{ github.run_id }}
          devenv-version: test-version
          cache-eval: true
          cache-nix: false
          cache-nix-eval: false
      - name: Clear comparison state before real evaluation
        shell: bash
        working-directory: tests/fixture
        run: |
          rm -rf .devenv "$HOME/.cache/nix/eval-cache-v6"
      - name: Seed snapshot-only comparison with real devenv shell
        working-directory: tests/fixture
        run: nix run nixpkgs#devenv -- shell -- true
      - name: Assert snapshot-only seed outputs and eval DB
        shell: bash
        working-directory: tests/fixture
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] || { echo "expected cache miss on snapshot-only seed"; exit 1; }
          [ -f .devenv/nix-eval-cache.db ] || { echo "snapshot-only seed did not create eval DB"; exit 1; }
          sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok

  compare-snapshot-warm:
    needs: compare-snapshot-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      # sqlite3 is preinstalled on the ubuntu runner image. Assert it instead of running
      # apt-get: an `apt-get update` against a stalled Azure mirror hangs the job until the
      # 6-hour timeout, and it only reinstalls a package that is already there.
      - run: sqlite3 --version
      - name: Restore snapshot-only comparison cache
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          key-prefix: comparison-snapshot
          key-suffix: ${{ github.run_id }}
          devenv-version: test-version
          cache-eval: true
          cache-nix: false
          cache-nix-eval: false
      - name: Assert exact snapshot-only hit and outputs
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] || { echo "expected exact cache hit on snapshot-only warm"; exit 1; }
          [ "${{ steps.cache.outputs.nix-eval-cache-restored }}" = "false" ] || { echo "expected nix-eval-cache-restored=false on snapshot-only warm"; exit 1; }
      - name: Assert conditional snapshot-only eval DB integrity
        shell: bash
        working-directory: tests/fixture
        run: |
          if [ "${{ steps.cache.outputs.eval-cache-restored }}" = "true" ]; then
            [ -f .devenv/nix-eval-cache.db ] || { echo "eval-cache-restored=true but devenv eval DB was not installed"; exit 1; }
            sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok
          elif [ "${{ steps.cache.outputs.eval-cache-restored }}" = "false" ]; then
            [ ! -e .devenv/nix-eval-cache.db ] || { echo "devenv eval DB was installed despite eval-cache-restored=false"; exit 1; }
          else
            echo "unexpected eval-cache-restored value: ${{ steps.cache.outputs.eval-cache-restored }}"
            exit 1
          fi
      - name: Time snapshot-only real devenv shell
        shell: bash
        working-directory: tests/fixture
        run: |
          start=$SECONDS
          nix run nixpkgs#devenv -- shell -- true
          echo "comparison=snapshot-only devenv-shell-seconds=$((SECONDS - start))"

  # Timing treatment: restore the same devenv snapshot plus bounded, validated Nix fingerprint DBs.
  compare-nix-eval-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      # sqlite3 is preinstalled on the ubuntu runner image. Assert it instead of running
      # apt-get: an `apt-get update` against a stalled Azure mirror hangs the job until the
      # 6-hour timeout, and it only reinstalls a package that is already there.
      - run: sqlite3 --version
      - name: Initialize bounded-Nix-eval comparison cache
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          key-prefix: comparison-nix-eval
          key-suffix: ${{ github.run_id }}
          devenv-version: test-version
          cache-eval: true
          cache-nix: false
          cache-nix-eval: true
      - name: Clear comparison state before real evaluation
        shell: bash
        working-directory: tests/fixture
        run: |
          rm -rf .devenv "$HOME/.cache/nix/eval-cache-v6"
      - name: Seed bounded-Nix-eval comparison with real devenv shell
        working-directory: tests/fixture
        run: nix run nixpkgs#devenv -- shell -- true
      - name: Assert bounded-Nix-eval seed outputs and genuine DB
        shell: bash
        working-directory: tests/fixture
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] || { echo "expected cache miss on bounded-Nix-eval seed"; exit 1; }
          [ -f .devenv/nix-eval-cache.db ] || { echo "bounded-Nix-eval seed did not create eval DB"; exit 1; }
          sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok
          genuine_nix_db="$(find "$HOME/.cache/nix/eval-cache-v6" -maxdepth 1 -type f -name '*.sqlite' -print -quit 2>/dev/null || true)"
          [ -n "$genuine_nix_db" ] || { echo "real devenv shell did not create a Nix fingerprint DB"; exit 1; }
          sqlite3 "$genuine_nix_db" 'PRAGMA quick_check;' | grep -qx ok

  compare-nix-eval-warm:
    needs: compare-nix-eval-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      # sqlite3 is preinstalled on the ubuntu runner image. Assert it instead of running
      # apt-get: an `apt-get update` against a stalled Azure mirror hangs the job until the
      # 6-hour timeout, and it only reinstalls a package that is already there.
      - run: sqlite3 --version
      - name: Restore bounded-Nix-eval comparison cache
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          key-prefix: comparison-nix-eval
          key-suffix: ${{ github.run_id }}
          devenv-version: test-version
          cache-eval: true
          cache-nix: false
          cache-nix-eval: true
      - name: Assert exact bounded-Nix-eval hit and outputs
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] || { echo "expected exact cache hit on bounded-Nix-eval warm"; exit 1; }
          [ "${{ steps.cache.outputs.nix-eval-cache-restored }}" = "true" ] || { echo "expected nix-eval-cache-restored=true on bounded-Nix-eval warm"; exit 1; }
          test "${{ steps.cache.outputs.nix-eval-files-restored }}" -ge 1 || { echo "expected a restored Nix eval-cache DB on bounded-Nix-eval warm"; exit 1; }
      - name: Assert conditional devenv and restored Nix DB integrity
        shell: bash
        working-directory: tests/fixture
        run: |
          if [ "${{ steps.cache.outputs.eval-cache-restored }}" = "true" ]; then
            [ -f .devenv/nix-eval-cache.db ] || { echo "eval-cache-restored=true but devenv eval DB was not installed"; exit 1; }
            sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok
          elif [ "${{ steps.cache.outputs.eval-cache-restored }}" = "false" ]; then
            [ ! -e .devenv/nix-eval-cache.db ] || { echo "devenv eval DB was installed despite eval-cache-restored=false"; exit 1; }
          else
            echo "unexpected eval-cache-restored value: ${{ steps.cache.outputs.eval-cache-restored }}"
            exit 1
          fi
          find "$HOME/.cache/nix/eval-cache-v6" -maxdepth 1 -type f -name '*.sqlite' -print -quit | grep -q .
      - name: Time bounded-Nix-eval real devenv shell
        shell: bash
        working-directory: tests/fixture
        run: |
          start=$SECONDS
          nix run nixpkgs#devenv -- shell -- true
          echo "comparison=snapshot-plus-bounded-nix-eval devenv-shell-seconds=$((SECONDS - start))"
  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      # sqlite3 is preinstalled on the ubuntu runner image. Assert it instead of running
      # apt-get: an `apt-get update` against a stalled Azure mirror hangs the job until the
      # 6-hour timeout, and it only reinstalls a package that is already there.
      - run: sqlite3 --version

      - name: Assert Nix eval restore replaces stale WAL and SHM sidecars
        shell: bash
        run: tests/restore-stale-wal.sh

      - name: Reject eval snapshots with stale Nix store closures
        shell: bash
        run: tests/restore-stale-store-reference.sh

      - name: Validate fail-closed eval-cache context matrix
        shell: bash
        run: tests/restore-context-matrix.sh

      - name: Assert zero-match hard error
        id: cache
        continue-on-error: true
        uses: ./
        with:
          hash-files: does-not-exist.nix

      - name: Check failure
        shell: bash
        run: |
          [ "${{ steps.cache.outcome }}" == "failure" ] || { echo "expected failure on zero hash-files match"; exit 1; }

      - name: Assert sqlite3 fallback via nix when not on PATH
        id: nosqlite
        continue-on-error: true
        uses: ./
        with:
          working-directory: tests/fixture
          devenv-version: test-version
          hash-files: devenv.nix
          sqlite3-path: /no/such/sqlite3

      - name: Check nix fallback succeeded
        shell: bash
        run: |
          [ "${{ steps.nosqlite.outcome }}" == "success" ] || { echo "expected nix run fallback to resolve sqlite3"; exit 1; }
