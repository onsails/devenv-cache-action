name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3

      # One call: restores at main (miss expected on seed), registers a success-gated
      # post-snapshot finalizer that runs before the cache post-save.
      - name: devenv eval cache (miss expected, post-snapshot registers here)
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          devenv-version: test-version
          key-suffix: ${{ github.run_id }}

      - name: Assert miss on first run
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] || { echo "expected cache miss on seed run (exact key)"; exit 1; }
          echo '${{ steps.cache.outputs.primary-key }}' | grep -Eq '^devenv-eval-Linux-x86_64-devenvtest-version-[0-9a-f]{64}(-[0-9]+)?$' \
            || { echo "primary-key shape wrong: ${{ steps.cache.outputs.primary-key }}"; exit 1; }

      # Seed the eval DB with a real evaluation. This runs AFTER the action main but BEFORE
      # the post-snapshot finalizer callback, which snapshots this DB at job completion.
      - run: nix run nixpkgs#devenv -- shell -- true
        working-directory: tests/fixture

      - name: Assert live DB exists after devenv shell
        shell: bash
        working-directory: tests/fixture
        run: |
          [ -f .devenv/nix-eval-cache.db ] || { echo "no .devenv/nix-eval-cache.db after devenv shell"; exit 1; }
          sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok

  # reuse proves the post-snapshot finalizer created the seed snapshot before the cache post-save
  # archived it: the only snapshot in the seed run is produced by the finalizer post callback, so a
  # successful eval-cache-restored here is executable proof of finalizer-before-cache-save ordering.
  # A log ordering assertion alone would not prove it.
  reuse:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3

      - name: Restore devenv eval cache (hit expected)
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          devenv-version: test-version
          key-suffix: ${{ github.run_id }}

      - name: Assert exact hit and eval restored
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" == "true" ] || { echo "expected cache hit on reuse run"; exit 1; }
          [ "${{ steps.cache.outputs.eval-cache-restored }}" == "true" ] || { echo "expected eval-cache-restored=true"; exit 1; }

      - name: Assert installed DB integrity
        shell: bash
        working-directory: tests/fixture
        run: |
          [ -f .devenv/nix-eval-cache.db ] || { echo "no installed DB"; exit 1; }
          sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok

      - name: Time devenv shell (reuses restored eval cache)
        shell: bash
        working-directory: tests/fixture
        run: |
          start=$SECONDS
          nix run nixpkgs#devenv -- shell -- true
          echo "devenv-shell-seconds=$((SECONDS - start))"

  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3

      - name: Assert zero-match hard error
        id: cache
        continue-on-error: true
        uses: ./
        with:
          hash-files: does-not-exist.nix

      - name: Check failure
        shell: bash
        run: |
          [ "${{ steps.cache.outcome }}" == "failure" ] || { echo "expected failure on zero hash-files match"; exit 1; }

      - name: Assert sqlite3 fallback via nix when not on PATH
        id: nosqlite
        continue-on-error: true
        uses: ./
        with:
          working-directory: tests/fixture
          devenv-version: test-version
          hash-files: devenv.nix
          sqlite3-path: /no/such/sqlite3

      - name: Check nix fallback succeeded
        shell: bash
        run: |
          [ "${{ steps.nosqlite.outcome }}" == "success" ] || { echo "expected nix run fallback to resolve sqlite3"; exit 1; }
