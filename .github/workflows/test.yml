name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3

      # One call: restores at main (miss expected on seed), registers a success-gated
      # post-snapshot finalizer that runs before the cache post-save.
      - name: devenv eval cache (miss expected, post-snapshot registers here)
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          devenv-version: test-version
          key-suffix: ${{ github.run_id }}
          cache-nix-eval: true

      - name: Assert miss on first run
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] || { echo "expected cache miss on seed run (exact key)"; exit 1; }
          echo '${{ steps.cache.outputs.primary-key }}' | grep -Eq '^devenv-eval-Linux-x86_64-layoutv3-nix0-eval1-nixeval1-devenvtest-version-[0-9a-f]{64}(-[0-9]+)?$' \
            || { echo "primary-key shape wrong: ${{ steps.cache.outputs.primary-key }}"; exit 1; }

      # Ensure the following assertion attributes the Nix fingerprint DB to the real devenv
      # evaluation, not to setup work performed earlier in this job.
      - name: Clear pre-evaluation Nix fingerprint DBs
        shell: bash
        run: rm -rf "$HOME/.cache/nix/eval-cache-v6"

      # Seed the eval DB with a real evaluation. This runs AFTER the action main but BEFORE
      # the post-snapshot finalizer callback, which snapshots this DB at job completion.
      - run: nix run nixpkgs#devenv -- shell -- true
        working-directory: tests/fixture

      - name: Assert real evaluation created healthy DBs, then add deterministic fixture
        shell: bash
        working-directory: tests/fixture
        run: |
          [ -f .devenv/nix-eval-cache.db ] || { echo "no .devenv/nix-eval-cache.db after devenv shell"; exit 1; }
          sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok

          # This must be a genuine Nix fingerprint database from the real devenv command above.
          # Check it before creating self-test.sqlite, which only makes bounded-cache validation
          # deterministic if Nix changes its fingerprint-cache population behavior.
          genuine_nix_db="$(find "$HOME/.cache/nix/eval-cache-v6" -maxdepth 1 -type f -name '*.sqlite' ! -name self-test.sqlite -print -quit 2>/dev/null || true)"
          [ -n "$genuine_nix_db" ] || { echo "real devenv shell did not create a Nix fingerprint DB"; exit 1; }
          sqlite3 "$genuine_nix_db" 'PRAGMA quick_check;' | grep -qx ok

          mkdir -p "$HOME/.cache/nix/eval-cache-v6"
          sqlite3 "$HOME/.cache/nix/eval-cache-v6/self-test.sqlite" 'CREATE TABLE IF NOT EXISTS seeded(value TEXT); INSERT INTO seeded VALUES ("seed");'
          sqlite3 "$HOME/.cache/nix/eval-cache-v6/self-test.sqlite" 'PRAGMA quick_check;' | grep -qx ok

  # warm-1 proves the post-snapshot finalizer created the seed snapshot before the cache post-save
  # archived it: the only seed snapshot is produced by the finalizer post callback, so a successful
  # eval-cache-restored here is executable proof of finalizer-before-cache-save ordering.
  # A log ordering assertion alone would not prove it.
  warm-1:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3

      - name: Restore devenv eval cache (exact hit expected)
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          devenv-version: test-version
          key-suffix: ${{ github.run_id }}
          cache-nix-eval: true

      - name: Assert exact hit and validated restores
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] || { echo "expected exact cache hit on warm-1"; exit 1; }
          [ "${{ steps.cache.outputs.eval-cache-restored }}" = "true" ] || { echo "expected eval-cache-restored=true"; exit 1; }
          [ "${{ steps.cache.outputs.nix-eval-cache-restored }}" = "true" ] || { echo "expected nix-eval-cache-restored=true"; exit 1; }
          test "${{ steps.cache.outputs.nix-eval-files-restored }}" -ge 1 || { echo "expected at least one restored Nix eval-cache DB"; exit 1; }

      - name: Assert installed DB integrity
        shell: bash
        working-directory: tests/fixture
        run: |
          sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok
          self_test="$HOME/.cache/nix/eval-cache-v6/self-test.sqlite"
          [ -f "$self_test" ] || { echo "seeded self-test.sqlite was not restored"; exit 1; }
          sqlite3 "$self_test" 'PRAGMA quick_check;' | grep -qx ok
          [ "$(sqlite3 "$self_test" 'SELECT value FROM seeded;')" = seed ] \
            || { echo "restored self-test.sqlite does not contain the seeded row"; exit 1; }

      - name: Time real devenv shell (reuses restored eval cache)
        shell: bash
        working-directory: tests/fixture
        run: |
          start=$SECONDS
          nix run nixpkgs#devenv -- shell -- true
          echo "devenv-shell-seconds=$((SECONDS - start))"

  # A second sequential warm restore exercises the same immutable archive after warm-1 completes.
  warm-2:
    needs: warm-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3

      - name: Restore devenv eval cache (exact hit expected)
        id: cache
        uses: ./
        with:
          working-directory: tests/fixture
          hash-files: devenv.nix
          devenv-version: test-version
          key-suffix: ${{ github.run_id }}
          cache-nix-eval: true

      - name: Assert exact hit and validated restores
        shell: bash
        run: |
          [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] || { echo "expected exact cache hit on warm-2"; exit 1; }
          [ "${{ steps.cache.outputs.eval-cache-restored }}" = "true" ] || { echo "expected eval-cache-restored=true"; exit 1; }
          [ "${{ steps.cache.outputs.nix-eval-cache-restored }}" = "true" ] || { echo "expected nix-eval-cache-restored=true"; exit 1; }
          test "${{ steps.cache.outputs.nix-eval-files-restored }}" -ge 1 || { echo "expected at least one restored Nix eval-cache DB"; exit 1; }

      - name: Assert installed DB integrity
        shell: bash
        working-directory: tests/fixture
        run: |
          sqlite3 .devenv/nix-eval-cache.db 'PRAGMA quick_check;' | grep -qx ok
          self_test="$HOME/.cache/nix/eval-cache-v6/self-test.sqlite"
          [ -f "$self_test" ] || { echo "seeded self-test.sqlite was not restored"; exit 1; }
          sqlite3 "$self_test" 'PRAGMA quick_check;' | grep -qx ok
          [ "$(sqlite3 "$self_test" 'SELECT value FROM seeded;')" = seed ] \
            || { echo "restored self-test.sqlite does not contain the seeded row"; exit 1; }

      - name: Time real devenv shell (reuses restored eval cache)
        shell: bash
        working-directory: tests/fixture
        run: |
          start=$SECONDS
          nix run nixpkgs#devenv -- shell -- true
          echo "devenv-shell-seconds=$((SECONDS - start))"

  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
          skipPush: true
      - run: nix profile add nixpkgs#devenv
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3

      - name: Assert Nix eval restore replaces stale WAL and SHM sidecars
        shell: bash
        run: tests/restore-stale-wal.sh

      - name: Assert zero-match hard error
        id: cache
        continue-on-error: true
        uses: ./
        with:
          hash-files: does-not-exist.nix

      - name: Check failure
        shell: bash
        run: |
          [ "${{ steps.cache.outcome }}" == "failure" ] || { echo "expected failure on zero hash-files match"; exit 1; }

      - name: Assert sqlite3 fallback via nix when not on PATH
        id: nosqlite
        continue-on-error: true
        uses: ./
        with:
          working-directory: tests/fixture
          devenv-version: test-version
          hash-files: devenv.nix
          sqlite3-path: /no/such/sqlite3

      - name: Check nix fallback succeeded
        shell: bash
        run: |
          [ "${{ steps.nosqlite.outcome }}" == "success" ] || { echo "expected nix run fallback to resolve sqlite3"; exit 1; }
